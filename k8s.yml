---
apiVersion: v1
kind: Service
metadata:
  name: spiders-service
  labels:
    app: spiders
spec:
  selector:
    app: spiders
  ports:
    - name: bkearlyproject
      protocol: TCP
      port: 84
      targetPort: 84
    - name: telegrambot
      protocol: TCP
      port: 83
      targetPort: 83
    - name: similarweb
      protocol: TCP
      port: 88
      targetPort: 88
    - name: bkproject-document
      protocol: TCP
      port: 89
      targetPort: 89
    - name: project-review
      protocol: TCP
      port: 90
      targetPort: 90
    - name: wallet-balance
      protocol: TCP
      port: 91
      targetPort: 91
    - name: birdeye-gems
      protocol: TCP
      port: 92
      targetPort: 92
    - name: gas
      protocol: TCP
      port: 93
      targetPort: 93
    - name: marketshare-bot
      protocol: TCP
      port: 94
      targetPort: 94
    - name: input-hub
      protocol: TCP
      port: 95
      targetPort: 95